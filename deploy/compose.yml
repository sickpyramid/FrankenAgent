# Production: docker compose -f deploy/compose.yml up -d --build
# The container listens only on the Docker bridge; a reverse proxy (Caddy) exposes it.
name: reafuse
services:
  reafuse:
    build: ..
    container_name: reafuse
    restart: unless-stopped
    ports:
      - "172.17.0.1:${REAFUSE_PORT:-8090}:4400"
    volumes:
      - reafuse_data:/data
    mem_limit: 900m
    environment:
      REAFUSE_RUNS_PER_HOUR: ${REAFUSE_RUNS_PER_HOUR:-6}
      # hybrid: Kilo Gateway (free) for lookups, specs and concepts; Claude CLI for contract, grow and repair.
      REAFUSE_BRAIN: ${REAFUSE_BRAIN:-hybrid}
      REAFUSE_KILO_MODEL: ${REAFUSE_KILO_MODEL:-kilo-auto/free}
volumes:
  reafuse_data:
    name: reafuse_data
